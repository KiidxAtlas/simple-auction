name: Build and publish Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Verify tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/release.sh --check "${GITHUB_REF_NAME}"

      - name: Build EXE
        run: python scripts/build_standalone.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $innoSetupPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          $isccPath = Join-Path $innoSetupPath "ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            throw "Inno Setup compiler not found at $isccPath"
          }
          $innoSetupPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        run: python scripts/build_installer.py

      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $installer = "dist/SimpleAuction-Setup-$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer not found: $installer"
          }
          python scripts/build_standalone.py --checksum $installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAuction-windows
          if-no-files-found: error
          path: |
            dist/SimpleAuction-Setup-*.exe
            dist/SimpleAuction-Setup-*.exe.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## {re.escape(version)} — \d{{4}}-\d{{2}}-\d{{2}}$",
              re.MULTILINE,
          )
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"Missing dated changelog heading for {version}.")
          remainder = changelog[match.end():]
          next_release = re.search(r"^## ", remainder, re.MULTILINE)
          body = remainder[: next_release.start()] if next_release else remainder
          Path("release-notes.md").write_text(body.strip() + "\n", encoding="utf-8")
          PY

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SimpleAuction-*
          path: release
          merge-multiple: true

      - name: Verify release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "release/SimpleAuction-Setup-${version}.exe"
          test -s "release/SimpleAuction-Setup-${version}.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SimpleAuction-Setup-*.exe
            release/SimpleAuction-Setup-*.exe.sha256
          fail_on_unmatched_files: true
          body_path: release-notes.md
          overwrite_files: true
