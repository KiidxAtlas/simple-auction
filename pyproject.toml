[project]
name = "simple-auction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atlas", email = "KiidxAtlas@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.29.0",
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pyside6>=6.12.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
simple-auction = "simple_auction.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
